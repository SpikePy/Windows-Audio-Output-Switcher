name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install rsrc (embeds the .ico as the .exe icon resource)
        run: go install github.com/akavel/rsrc@latest

      - name: Embed application icon into each binary
        run: |
          rsrc -ico assets/icons/icon.ico -o cmd/switcher/rsrc_windows_amd64.syso
          rsrc -ico assets/icons/icon.ico -o cmd/installer/rsrc_windows_amd64.syso
          rsrc -ico assets/icons/icon.ico -o cmd/uninstaller/rsrc_windows_amd64.syso

      - name: Build switcher.exe (GUI subsystem, no console window)
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: >
          go build -trimpath -ldflags "-s -w -H=windowsgui -X main.version=${{ github.ref_name }}"
          -o dist/AudioOutputSwitcher.exe
          ./cmd/switcher

      - name: Build installer and uninstaller (console apps)
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" -o dist/AudioOutputSwitcherInstall.exe ./cmd/installer
          go build -trimpath -ldflags "-s -w -X main.version=${{ github.ref_name }}" -o dist/AudioOutputSwitcherUninstall.exe ./cmd/uninstaller

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: dist/*.exe

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.exe
