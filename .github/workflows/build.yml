name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      # Keep the checkout byte-identical to the repo (Git for Windows would
      # otherwise convert text files to CRLF).
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.24"

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet -unsafeptr=false ./...

      - name: Build switcher.exe (GUI subsystem, no console window)
        env:
          CGO_ENABLED: 0
        run: >
          go build -trimpath -ldflags "-s -w -H=windowsgui -X main.version=${{ github.ref_name }}"
          -o dist/AudioOutputSwitcher.exe
          ./cmd/switcher

      - name: Build Setup_AudioOutputSwitcher.exe (GUI subsystem, has its own window)
        env:
          CGO_ENABLED: 0
        run: >
          go build -trimpath -ldflags "-s -w -H=windowsgui -X main.version=${{ github.ref_name }}"
          -o dist/Setup_AudioOutputSwitcher.exe
          ./cmd/setup

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-binaries
          path: dist/*.exe

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*.exe
